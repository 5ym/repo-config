name: Renovate

# danything と 5ym の全リポジトリの依存を上げる PR を出す。**ふだんはここでは回さない。**
# 2026-10 から danything/gitops の apps/renovate/ の CronJob が 15 分おきに回している
# (GitHub の schedule は 15〜40 分遅れ、丸ごと飛ばされることもあったため)。
# これはクラスタが落ちているときの予備。Actions の画面から workflow_dispatch で手で回す。
# **CronJob と同時に走らせないこと**(同じリポジトリに 2 つの Renovate が触る)。
# 設定は CronJob 側と揃えておく(apps/renovate/renovate.yaml の renovate-github)
on:
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    # GitHub App doa-renovate のインストールごとにトークンが分かれるので owner ごとに回す
    strategy:
      fail-fast: false
      matrix:
        owner: [danything, 5ym]
    concurrency:
      group: renovate-${{ matrix.owner }}
      cancel-in-progress: false
    container:
      image: ghcr.io/renovatebot/renovate:44.164.10
      # 既定の非 root ユーザーだと runner が用意する /__w や /__e に書けない
      options: --user root
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # GitHub App doa-renovate(danything の org が持ち主。5ym にもインストールしてある)
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
      - run: renovate
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          # App のトークンからは自分のユーザーを引けないので明示する。id は
          # `gh api users/doa-renovate%5Bbot%5D --jq .id`
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          # コミットを API で作る = App の署名付き(Verified)になる
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: ${{ matrix.owner }}/*
          # renovate.json の無いリポジトリには、共有プリセットを使う renovate.json を
          # 足す onboarding の PR を出す。マージされるまでは依存の PR は出さない
          RENOVATE_ONBOARDING: "true"
          RENOVATE_ONBOARDING_CONFIG: '{"$schema":"https://docs.renovatebot.com/renovate-schema.json","extends":["github>5ym/repo-config"]}'
          RENOVATE_REQUIRE_CONFIG: required
          # postUpgradeTasks で流してよいコマンド(正規表現。これに合わないものは Renovate が拒む)。
          # danything/gitops の pulumi/ は bun.lock を Renovate が作れない(SDK を pulumi install でしか作れない)ので、
          # そのリポジトリのスクリプトで pulumi install させる(gitops の pulumi/README.md)。
          # 同じく gitops の AdGuard Home の版上げでは、新しい版に config.yaml を移行させる
          # (gitops の apps/adguardhome/renovate-post-upgrade.sh)
          RENOVATE_ALLOWED_COMMANDS: '["^bash pulumi/renovate-post-upgrade\\.sh$", "^bash apps/adguardhome/renovate-post-upgrade\\.sh$"]'
          LOG_LEVEL: info
