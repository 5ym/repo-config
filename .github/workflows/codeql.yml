name: CodeQL

# 各リポジトリから呼ぶ CodeQL の解析 (advanced setup)。呼ぶ側は数行で済む:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     schedule:
#       - cron: "23 4 * * 1"
#   jobs:
#     codeql:
#       permissions:
#         security-events: write
#         contents: read
#         actions: read
#       uses: 5ym/repo-config/.github/workflows/codeql.yml@main
#       with:
#         languages: '["actions", "csharp"]'
#         # 任意。PR がこのパターンに当たるファイルを触っていなければ、その言語の解析を飛ばす
#         language-paths: '{"csharp": ["src/*", "*.cs", "*.csproj", "global.json"]}'
#
# default setup は C# を build-mode: none (ビルドせずにソースだけ読む) で解析し、呼び出し先を
# 解決しきれずに「Low C# analysis quality」の警告が出る (denpa で 83%、しきい値 85%)。
# default setup では言語ごとの build mode を選べないので、ここで C# だけビルドして解析する。
# - C#: .NET を入れてビルドする。`csharp-build` を渡せばそのコマンド (manual)、無ければ autobuild
# - Go: none が無いので autobuild
# - ほかの言語: default setup と同じ none
# クエリ (default) と脅威モデル (remote) は既定のまま。category は default setup と同じ
# /language:<言語> にして、それまでのアラートを引き継ぐ。
#
# default setup と同時には使えない (オンだと結果が受け付けられない)。呼ぶ側のリポジトリでは
# default setup を切る。repo-settings.yml の毎日の実行も、これを呼ぶリポジトリでは default setup をオンにしない。
#
# language-paths を渡すと、PR では触ったファイルがどのパターンにも当たらない言語の解析を飛ばす。
# ジョブは走らせて、解析の段だけを飛ばして成功で終える (Analyze (<言語>) を必須チェックにしていても、PR はマージできる)。
# ジョブの if で飛ばさないのは、matrix の 1 つだけを飛ばせないため (ジョブの if は matrix を読めない。
# matrix から外すと、そのチェックが出ずに必須チェックが保留のまま残る)。触ったファイルは git の差で読み
# (PR をベースのブランチに重ねたコミットと、ベースの差)、読めなかったときは全部解析する。
# 飛ばした言語は、その PR に結果 (SARIF) を上げない。ruleset の code_scanning で結果を必須にしているリポジトリでは使わない。
on:
  workflow_call:
    inputs:
      languages:
        description: 解析する言語 (JSON の配列。例 '["actions", "csharp", "javascript-typescript"]')
        type: string
        required: true
      csharp-build:
        description: C# のビルドのコマンド (例 'dotnet build agent/App.Tests/App.Tests.csproj')。空なら autobuild
        type: string
        default: ""
      dotnet-version:
        description: 入れる .NET SDK のバージョン。空なら global.json の sdk.version、それも無ければ 11.x
        type: string
        default: ""
      language-paths:
        description: >-
          言語ごとのパスのパターン (JSON のオブジェクト。例 '{"csharp": ["agent/*", "*.cs"]}')。
          pull_request では、PR がどのパターンにも当たるファイルを触っていない言語の解析を飛ばす。
          パターンは bash の [[ == ]] で比べる (* は / にも当たる)。書いていない言語と、pull_request 以外では全部解析する
        type: string
        default: "{}"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # 結果を Code scanning に上げる
      security-events: write
      contents: read
      # 実行の情報を読む (codeql-action が使う)
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose whether to analyze
        id: run
        env:
          LANGUAGE: ${{ matrix.language }}
          LANGUAGE_PATHS: ${{ inputs.language-paths }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          patterns=$(jq -r --arg l "$LANGUAGE" '.[$l] // [] | .[]' <<< "$LANGUAGE_PATHS")
          if [ "$EVENT" != pull_request ] || [ -z "$patterns" ]; then echo analyze=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # checkout は PR をベースのブランチに重ねたコミット (HEAD) を取ってくる。その 1 つ目の親が BASE なので、2 つの差が PR の変更になる。
          # --no-renames で、移した・消したファイルは元の場所も並べる
          if ! git fetch --no-tags --quiet --depth=1 origin "$BASE" || ! files=$(git diff --name-only --no-renames "$BASE" HEAD); then
            echo analyze=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          while IFS= read -r f; do
            while IFS= read -r p; do
              # shellcheck disable=SC2053 # パターンとして比べる
              if [[ $f == $p ]]; then echo "analyze=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            done <<< "$patterns"
          done <<< "$files"
          echo "analyze=false" >> "$GITHUB_OUTPUT"
          echo "::notice::この PR は language-paths の $LANGUAGE のパターンに当たるファイルを触っていないので、解析を飛ばしました"

      - name: Choose build mode
        id: mode
        if: steps.run.outputs.analyze == 'true'
        env:
          LANGUAGE: ${{ matrix.language }}
          CSHARP_BUILD: ${{ inputs.csharp-build }}
        run: |
          case "$LANGUAGE" in
            csharp) if [ -n "$CSHARP_BUILD" ]; then echo mode=manual; else echo mode=autobuild; fi ;;
            go) echo mode=autobuild ;;
            *) echo mode=none ;;
          esac >> "$GITHUB_OUTPUT"

      # global.json に sdk.version があればそれに合わせる (test.runner だけの global.json もある)。
      # jq で読むので、コメント入りの global.json は読めずに 11.x になる。そのときは dotnet-version を渡す
      - name: Choose .NET version
        id: dotnet
        if: steps.run.outputs.analyze == 'true' && matrix.language == 'csharp'
        env:
          DOTNET_VERSION: ${{ inputs.dotnet-version }}
        run: |
          if [ -n "$DOTNET_VERSION" ]; then
            echo "version=$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -f global.json ] && jq -e '.sdk.version' global.json > /dev/null; then
            echo "global-json-file=global.json" >> "$GITHUB_OUTPUT"
          else
            echo "version=11.x" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.run.outputs.analyze == 'true' && matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ steps.dotnet.outputs.version }}
          global-json-file: ${{ steps.dotnet.outputs.global-json-file }}

      - name: Initialize CodeQL
        if: steps.run.outputs.analyze == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ steps.mode.outputs.mode }}

      - name: Build
        if: steps.run.outputs.analyze == 'true' && steps.mode.outputs.mode == 'manual'
        env:
          CSHARP_BUILD: ${{ inputs.csharp-build }}
        run: eval "$CSHARP_BUILD"

      - name: Analyze
        if: steps.run.outputs.analyze == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
