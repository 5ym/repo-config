name: Repo settings

# danything と 5ym の全リポジトリ(アーカイブ済みを除く)に、repo-settings.json の設定と rulesets.json のルールセットを当てる。
# ルールセットは既定のブランチの削除と force push を止めるだけ (管理者は外せる)。必須のチェックはリポジトリごとに違うので、
# 各リポジトリが自分のルールセットで持つ (denpa の default など)。ここで持つのは名前が repo-config のものだけで、ほかには触らない。
# 非公開のリポジトリは、プランによってはルールセットを使えない (403)。そのときは知らせて飛ばす
# 新しいリポジトリも次の実行で揃い、手で変えた設定も戻る。
# トークンは GitHub App doa-repo-settings(リポジトリの Administration の書き込みだけ。danything と 5ym に入れてある)
on:
  push:
    branches: [main]
    paths:
      - repo-settings.json
      - rulesets.json
      - security-settings.json
      - .github/workflows/repo-settings.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        owner: [danything, 5ym]
    steps:
      - uses: actions/checkout@v7
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
      - name: apply
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          want=$(cat repo-settings.json)
          keys=$(jq -r 'keys[]' repo-settings.json | paste -sd, -)
          changed=0
          failed=0
          for repo in $(gh api installation/repositories --paginate -q '.repositories[] | select(.archived | not) | .full_name'); do
            have=$(gh api "repos/$repo" | jq -c --arg k "$keys" '. as $r | ($k | split(",")) | map({(.): $r[.]}) | add')
            if [ "$(jq -S -c . <<<"$have")" != "$(jq -S -c . <<<"$want")" ]; then
              echo "::notice title=$repo::$(jq -c --argjson w "$want" 'to_entries | map(select(.value != $w[.key])) | map("\(.key): \(.value) → \($w[.key])") | join(", ")' <<<"$have")"
              # 1 本が失敗しても残りは揃える。失敗はまとめて最後にジョブを落とす
              if gh api -X PATCH "repos/$repo" --input repo-settings.json > /dev/null; then
                changed=$((changed + 1))
              else
                echo "::error title=$repo::設定を当てられなかった"
                failed=$((failed + 1))
              fi
            fi
          done
          echo "${{ matrix.owner }}: ${changed} 本を直した、${failed} 本は失敗" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          name=$(jq -r .name rulesets.json)
          # 比べるのは書いた項目だけ (GitHub が足す id や日時は見ない)
          norm='{name, target, enforcement, conditions, rules: [.rules[] | {type}], bypass_actors: [.bypass_actors[] | {actor_id, actor_type, bypass_mode}]}'
          want=$(jq -S -c "$norm" rulesets.json)
          created=0
          updated=0
          failed=0
          skipped=0
          err=$(mktemp)
          for repo in $(gh api installation/repositories --paginate -q '.repositories[] | select(.archived | not) | .full_name'); do
            if ! list=$(gh api "repos/$repo/rulesets" 2>"$err"); then
              # 飛ばすのはプランに無い (403) ときだけ。ほかの失敗 (権限の欠落・障害) は数えて落とす
              if grep -q "HTTP 403" "$err"; then
                echo "::notice title=$repo::ルールセットを使えない (非公開でプランに無いなど)。飛ばす"
                skipped=$((skipped + 1))
              else
                echo "::error title=$repo::ルールセットを読めなかった: $(head -c 300 "$err")"
                failed=$((failed + 1))
              fi
              continue
            fi
            id=$(jq -r --arg n "$name" '.[] | select(.name == $n and .source_type == "Repository") | .id' <<<"$list" | head -1)
            if [ -n "$id" ]; then
              have=$(gh api "repos/$repo/rulesets/$id" | jq -S -c "$norm")
              [ "$have" = "$want" ] && continue
              echo "::notice title=$repo::ルールセット $name を直す: $have"
              if gh api -X PUT "repos/$repo/rulesets/$id" --input rulesets.json > /dev/null; then
                updated=$((updated + 1))
              else
                echo "::error title=$repo::ルールセットを直せなかった"
                failed=$((failed + 1))
              fi
            else
              echo "::notice title=$repo::ルールセット $name を作る"
              if gh api -X POST "repos/$repo/rulesets" --input rulesets.json > /dev/null; then
                created=$((created + 1))
              else
                echo "::error title=$repo::ルールセットを作れなかった"
                failed=$((failed + 1))
              fi
            fi
          done
          echo "${{ matrix.owner }} のルールセット: ${created} 本を作った、${updated} 本を直した、${skipped} 本は飛ばした、${failed} 本は失敗" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: security
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # 公開リポジトリなら無料で使えるものだけをオンにする (オフに戻すことはしない)。
          # - シークレットの検出と push の保護: security-settings.json の security_and_analysis
          # - Dependabot のアラート: 脆弱性を知らせるだけ。直す PR は Renovate が出すので、Dependabot の security updates は触らない
          # - 脆弱性の非公開の報告 (Security → Report a vulnerability)
          # - CodeQL の default setup: fork は除く (上流のコードを毎週解析しても誰も読まない)。
          #   自分の CodeQL の workflow (advanced setup) を持つリポジトリも除く。default setup と同時には使えず、
          #   オンにすると advanced の結果が受け付けられなくなる (denpa は C# をビルドして解析するために advanced にした)
          # 非公開でプランに無い (403/422)・解析できる言語が無い (422) ものは知らせて飛ばす
          changed=0
          failed=0
          skipped=0
          err=$(mktemp)
          want=$(jq -S -c '.security_and_analysis | map_values(.status)' security-settings.json)
          # 1 つ当てる。プランに無い・対象外 (403/404/422) は飛ばし、ほかの失敗は数える
          apply() {
            local repo=$1 what=$2
            shift 2
            if gh api "$@" > /dev/null 2>"$err"; then
              echo "::notice title=$repo::$what をオンにした"
              changed=$((changed + 1))
            elif grep -qE "HTTP (403|404|422)" "$err"; then
              echo "::notice title=$repo::$what を使えない。飛ばす: $(head -c 200 "$err")"
              skipped=$((skipped + 1))
            else
              echo "::error title=$repo::$what をオンにできなかった: $(head -c 300 "$err")"
              failed=$((failed + 1))
            fi
          }
          # 既定のブランチの .github/workflows/ に github/codeql-action/analyze を使う workflow があれば advanced setup とみなす。
          # default setup の workflow は path が dynamic/ で始まるので、ここには入らない。消えたファイル (404) は数えない。
          # 0: ある、1: 無い、2: 確かめられない (API の失敗)。確かめられないときはオンにしない方を選ぶ
          has_advanced() {
            local repo=$1 paths path body
            paths=$(gh api "repos/$repo/actions/workflows" --paginate -q '.workflows[] | select(.path | startswith(".github/workflows/")) | .path' 2>"$err") || return 2
            for path in $paths; do
              if body=$(gh api -H "Accept: application/vnd.github.raw" "repos/$repo/contents/$path" 2>"$err"); then
                grep -q "github/codeql-action/analyze" <<<"$body" && return 0
              elif ! grep -q "HTTP 404" "$err"; then
                return 2
              fi
            done
            return 1
          }
          while read -r repo fork; do
            have=$(gh api "repos/$repo" | jq -S -c --argjson w "$want" '(.security_and_analysis // {}) | with_entries(select(.key | in($w))) | map_values(.status)')
            if [ "$have" != "$want" ]; then
              apply "$repo" "シークレットの検出" -X PATCH "repos/$repo" --input security-settings.json
            fi
            if ! gh api "repos/$repo/vulnerability-alerts" > /dev/null 2>&1; then
              apply "$repo" "Dependabot のアラート" -X PUT "repos/$repo/vulnerability-alerts"
            fi
            if [ "$(gh api "repos/$repo/private-vulnerability-reporting" -q .enabled 2>/dev/null || echo false)" != "true" ]; then
              apply "$repo" "脆弱性の非公開の報告" -X PUT "repos/$repo/private-vulnerability-reporting"
            fi
            if [ "$fork" = "false" ] && [ "$(gh api "repos/$repo/code-scanning/default-setup" -q .state 2>/dev/null || echo unknown)" = "not-configured" ]; then
              rc=0
              has_advanced "$repo" || rc=$?
              case $rc in
                0) echo "::notice title=$repo::自分の CodeQL の workflow (advanced setup) があるので、default setup はオンにしない" ;;
                1) apply "$repo" "CodeQL" -X PATCH "repos/$repo/code-scanning/default-setup" -f state=configured ;;
                *)
                  echo "::warning title=$repo::CodeQL の workflow があるか確かめられないので、default setup はオンにしない: $(head -c 200 "$err")"
                  skipped=$((skipped + 1))
                  ;;
              esac
            fi
          done < <(gh api installation/repositories --paginate -q '.repositories[] | select(.archived | not) | "\(.full_name) \(.fork)"')
          echo "${{ matrix.owner }} のセキュリティの設定: ${changed} 件をオンにした、${skipped} 件は飛ばした、${failed} 件は失敗" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
